<!DOCTYPE html>
<html lang="en">
  <head>
    
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
  <script src="https://cdn.jsdelivr.net/npm/vega@5.20.2"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5.1.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.17.0"></script>
  <script src="vegalitevis.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-tooltip@0.33.0/build/vega-tooltip.min.js"></script>
    
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vega-tooltip@0.33.0/build/vega-tooltip.css">
  <link rel="stylesheet" type="text/css" href="css/styles.css" media="all">

  <title>Homework Week 10</title>
  </head>
  
  <body>
  <h1>Bar Chart</h1>
  <div id="bar_chart" style="display:block; width:500px; height:500px;"></div>

  

  <h1>Improved Choropleth Map</h1>
  <div id="choropleth_map"></div>
  
  </body>

  <script type="text/javascript">
    var vg_1 = "js/bar_chart.vg.json";
    vegaEmbed("#bar_chart", vg_1, {
      tooltip: {
        renderer: (handler, event, item, value) => {
          if (!value) return;

          const html = value.map(d => {
            return '<div><strong>${d.title}</strong>: ${d.value}</div>';
          }).join('');

          handler.html(html);
        }
      }
    }).then(function(result) {
    // Access the Vega view instance (https://vega.github.io/vega/docs/api/view/) as result.view
  }).catch(console.error);

    var vg_2 = "js/choropleth_map_1.vg.json";
    vegaEmbed("#choropleth_map", vg_2).then(function(result) {
    // Access the Vega view instance (https://vega.github.io/vega/docs/api/view/) as result.view
  }).catch(console.error);
                                       
  </script>
  
</html>
